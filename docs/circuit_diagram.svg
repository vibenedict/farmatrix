<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 800" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070a13"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="unoGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00878F"/>
      <stop offset="100%" stop-color="#005B60"/>
    </linearGradient>
    <linearGradient id="relayGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#172554"/>
    </linearGradient>
    <linearGradient id="dhtGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <linearGradient id="soilGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1100" height="800" fill="url(#bgGrad)" rx="16"/>
  <!-- Grid Lines (Subtle) -->
  <g opacity="0.06" stroke="#94a3b8" stroke-width="1">
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40"/>
    </pattern>
    <rect width="1100" height="800" fill="url(#grid)"/>
  </g>

  <!-- Title & Legend Header -->
  <g transform="translate(50, 45)">
    <text x="0" y="0" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="24" fill="#ffffff" letter-spacing="1">
      FARMATRIX • ARDUINO UNO R3 HARDWARE CIRCUIT SCHEMATIC
    </text>
    <text x="0" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#38bdf8" font-weight="600">
      Smart IoT Agriculture Monitoring &amp; Isolated Automated Irrigation Circuit (5V Optocoupler Relay)
    </text>

    <!-- Legend -->
    <g transform="translate(680, -15)">
      <rect x="0" y="0" width="320" height="50" rx="8" fill="#1e293b" opacity="0.7" stroke="#334155"/>
      <!-- Legend items -->
      <line x1="15" y1="18" x2="35" y2="18" stroke="#ef4444" stroke-width="3"/>
      <text x="42" y="22" font-size="11" fill="#cbd5e1" font-family="monospace">5V VCC</text>

      <line x1="95" y1="18" x2="115" y2="18" stroke="#64748b" stroke-width="3"/>
      <text x="122" y="22" font-size="11" fill="#cbd5e1" font-family="monospace">GND</text>

      <line x1="165" y1="18" x2="185" y2="18" stroke="#10b981" stroke-width="3"/>
      <text x="192" y="22" font-size="11" fill="#cbd5e1" font-family="monospace">Analog A0</text>

      <line x1="15" y1="36" x2="35" y2="36" stroke="#38bdf8" stroke-width="3"/>
      <text x="42" y="40" font-size="11" fill="#cbd5e1" font-family="monospace">Data D2</text>

      <line x1="95" y1="36" x2="115" y2="36" stroke="#f59e0b" stroke-width="3"/>
      <text x="122" y="40" font-size="11" fill="#cbd5e1" font-family="monospace">Relay D8</text>

      <line x1="165" y1="36" x2="185" y2="36" stroke="#ec4899" stroke-width="3"/>
      <text x="192" y="40" font-size="11" fill="#cbd5e1" font-family="monospace">Pump PWR</text>
    </g>
  </g>

  <!-- ==================== ARDUINO UNO R3 BOARD ==================== -->
  <g transform="translate(370, 260)">
    <!-- PCB Board -->
    <rect x="0" y="0" width="340" height="250" rx="14" fill="url(#unoGrad)" stroke="#004d52" stroke-width="3" filter="drop-shadow(0 10px 20px rgba(0,0,0,0.5))"/>
    
    <!-- USB Port -->
    <rect x="-25" y="25" width="45" height="40" rx="3" fill="#94a3b8" stroke="#64748b" stroke-width="2"/>
    <text x="-20" y="48" font-family="monospace" font-size="9" fill="#0f172a" font-weight="bold">USB</text>

    <!-- DC Barrel Jack -->
    <rect x="-25" y="160" width="45" height="50" rx="4" fill="#1e293b" stroke="#0f172a" stroke-width="2"/>
    <circle cx="2" cy="185" r="7" fill="#64748b"/>

    <!-- Microcontroller Chip (ATmega328P DIP) -->
    <rect x="110" y="110" width="130" height="45" rx="3" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <text x="122" y="136" font-family="monospace" font-size="10" fill="#94a3b8" font-weight="bold">ATmega328P-PU</text>
    <!-- IC Pins -->
    <g fill="#64748b">
      <rect x="115" y="103" width="4" height="7"/>
      <rect x="127" y="103" width="4" height="7"/>
      <rect x="139" y="103" width="4" height="7"/>
      <rect x="151" y="103" width="4" height="7"/>
      <rect x="163" y="103" width="4" height="7"/>
      <rect x="175" y="103" width="4" height="7"/>
      <rect x="187" y="103" width="4" height="7"/>
      <rect x="199" y="103" width="4" height="7"/>
      <rect x="211" y="103" width="4" height="7"/>
      <rect x="223" y="103" width="4" height="7"/>

      <rect x="115" y="155" width="4" height="7"/>
      <rect x="127" y="155" width="4" height="7"/>
      <rect x="139" y="155" width="4" height="7"/>
      <rect x="151" y="155" width="4" height="7"/>
      <rect x="163" y="155" width="4" height="7"/>
      <rect x="175" y="155" width="4" height="7"/>
      <rect x="187" y="155" width="4" height="7"/>
      <rect x="199" y="155" width="4" height="7"/>
      <rect x="211" y="155" width="4" height="7"/>
      <rect x="223" y="155" width="4" height="7"/>
    </g>

    <!-- Board Name -->
    <text x="115" y="60" font-family="sans-serif" font-weight="900" font-size="18" fill="#ffffff" opacity="0.9">ARDUINO</text>
    <text x="115" y="80" font-family="monospace" font-size="13" fill="#cbd5e1" font-weight="bold">UNO R3</text>

    <!-- Top Female Header (Digital Pins D0 - D13 + GND + AREF) -->
    <rect x="50" y="8" width="270" height="18" rx="2" fill="#0f172a" stroke="#1e293b"/>
    <g font-family="monospace" font-size="8" fill="#e2e8f0" text-anchor="middle">
      <text x="70" y="21">D0</text>
      <text x="90" y="21">D1</text>
      <text x="110" y="21" fill="#38bdf8" font-weight="bold">D2</text>
      <text x="130" y="21">D3</text>
      <text x="150" y="21">D4</text>
      <text x="170" y="21">D5</text>
      <text x="190" y="21">D6</text>
      <text x="210" y="21">D7</text>
      <text x="230" y="21" fill="#f59e0b" font-weight="bold">D8</text>
      <text x="250" y="21">D9</text>
      <text x="270" y="21">D10</text>
      <text x="290" y="21">GND</text>
    </g>
    <!-- Digital Pin Connectors -->
    <circle cx="110" cy="5" r="4" fill="#38bdf8"/>
    <circle cx="230" cy="5" r="4" fill="#f59e0b"/>
    <circle cx="290" cy="5" r="4" fill="#64748b"/>

    <!-- Bottom Female Header (Power & Analog) -->
    <rect x="50" y="224" width="270" height="18" rx="2" fill="#0f172a" stroke="#1e293b"/>
    <g font-family="monospace" font-size="8" fill="#e2e8f0" text-anchor="middle">
      <text x="65" y="237">IOREF</text>
      <text x="85" y="237">RESET</text>
      <text x="105" y="237">3.3V</text>
      <text x="125" y="237" fill="#ef4444" font-weight="bold">5V</text>
      <text x="145" y="237" fill="#64748b" font-weight="bold">GND</text>
      <text x="165" y="237">GND</text>
      <text x="185" y="237">VIN</text>
      <text x="215" y="237" fill="#10b981" font-weight="bold">A0</text>
      <text x="235" y="237">A1</text>
      <text x="255" y="237">A2</text>
      <text x="275" y="237">A3</text>
      <text x="295" y="237">A4</text>
    </g>
    <!-- Analog & Power Pin Connectors -->
    <circle cx="125" cy="245" r="4" fill="#ef4444"/>
    <circle cx="145" cy="245" r="4" fill="#64748b"/>
    <circle cx="215" cy="245" r="4" fill="#10b981"/>
  </g>

  <!-- ==================== DHT22 TEMPERATURE & HUMIDITY ==================== -->
  <g transform="translate(60, 160)">
    <!-- Sensor Body -->
    <rect x="0" y="0" width="130" height="150" rx="8" fill="url(#dhtGrad)" stroke="#94a3b8" stroke-width="2" filter="drop-shadow(0 6px 12px rgba(0,0,0,0.3))"/>
    <!-- Grill vents -->
    <g fill="#94a3b8">
      <rect x="20" y="25" width="90" height="6" rx="2"/>
      <rect x="20" y="37" width="90" height="6" rx="2"/>
      <rect x="20" y="49" width="90" height="6" rx="2"/>
      <rect x="20" y="61" width="90" height="6" rx="2"/>
      <rect x="20" y="73" width="90" height="6" rx="2"/>
      <rect x="20" y="85" width="90" height="6" rx="2"/>
    </g>
    <text x="65" y="112" font-family="sans-serif" font-weight="bold" font-size="12" fill="#0f172a" text-anchor="middle">DHT22 / AM2302</text>
    <text x="65" y="126" font-family="sans-serif" font-size="9" fill="#475569" text-anchor="middle">Temp &amp; Humidity</text>

    <!-- Pins -->
    <rect x="18" y="150" width="6" height="25" fill="#e2e8f0"/>
    <rect x="46" y="150" width="6" height="25" fill="#e2e8f0"/>
    <rect x="74" y="150" width="6" height="25" fill="#94a3b8"/> <!-- NC -->
    <rect x="102" y="150" width="6" height="25" fill="#e2e8f0"/>

    <text x="21" y="190" font-family="monospace" font-size="8" fill="#ef4444" font-weight="bold" text-anchor="middle">VCC</text>
    <text x="49" y="190" font-family="monospace" font-size="8" fill="#38bdf8" font-weight="bold" text-anchor="middle">DATA</text>
    <text x="77" y="190" font-family="monospace" font-size="7" fill="#64748b" text-anchor="middle">NC</text>
    <text x="105" y="190" font-family="monospace" font-size="8" fill="#94a3b8" font-weight="bold" text-anchor="middle">GND</text>

    <!-- 10k Pull-up Resistor Callout -->
    <g transform="translate(140, 140)">
      <rect x="0" y="0" width="70" height="30" rx="4" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
      <text x="35" y="14" font-family="monospace" font-size="8" fill="#f59e0b" text-anchor="middle" font-weight="bold">10kΩ RESISTOR</text>
      <text x="35" y="24" font-family="sans-serif" font-size="7" fill="#cbd5e1" text-anchor="middle">VCC to DATA</text>
    </g>
  </g>

  <!-- ==================== CAPACITIVE SOIL MOISTURE SENSOR ==================== -->
  <g transform="translate(60, 470)">
    <!-- PCB Upper -->
    <rect x="0" y="0" width="130" height="90" rx="6" fill="url(#soilGrad)" stroke="#334155" stroke-width="2"/>
    <circle cx="65" cy="30" r="10" fill="#0f172a" stroke="#475569"/>
    <text x="65" y="58" font-family="sans-serif" font-weight="bold" font-size="10" fill="#38bdf8" text-anchor="middle">CAPACITIVE SOIL</text>
    <text x="65" y="72" font-family="monospace" font-size="8" fill="#94a3b8" text-anchor="middle">Moisture Sensor v1.2</text>

    <!-- Blade Prong (Inserted into soil) -->
    <path d="M 30 90 L 30 220 L 55 250 L 75 250 L 100 220 L 100 90 Z" fill="#1e293b" stroke="#334155" stroke-width="2"/>
    <line x1="65" y1="95" x2="65" y2="235" stroke="#10b981" stroke-width="2" stroke-dasharray="4 4"/>
    <text x="65" y="160" font-family="sans-serif" font-size="9" fill="#10b981" text-anchor="middle" font-weight="bold" transform="rotate(-90, 65, 160)">
      Corrosion-Proof Probe
    </text>

    <!-- Header Pins on Top -->
    <rect x="25" y="-18" width="6" height="18" fill="#e2e8f0"/>
    <rect x="62" y="-18" width="6" height="18" fill="#e2e8f0"/>
    <rect x="99" y="-18" width="6" height="18" fill="#e2e8f0"/>
    <text x="28" y="-23" font-family="monospace" font-size="8" fill="#ef4444" font-weight="bold" text-anchor="middle">VCC</text>
    <text x="65" y="-23" font-family="monospace" font-size="8" fill="#64748b" font-weight="bold" text-anchor="middle">GND</text>
    <text x="102" y="-23" font-family="monospace" font-size="8" fill="#10b981" font-weight="bold" text-anchor="middle">AOUT</text>
  </g>

  <!-- ==================== 5V RELAY MODULE ==================== -->
  <g transform="translate(800, 160)">
    <rect x="0" y="0" width="160" height="210" rx="8" fill="#0f172a" stroke="#334155" stroke-width="2" filter="drop-shadow(0 6px 14px rgba(0,0,0,0.4))"/>
    
    <!-- Blue Relay Cube -->
    <rect x="25" y="25" width="110" height="90" rx="4" fill="url(#relayGrad)" stroke="#3b82f6" stroke-width="2"/>
    <text x="80" y="60" font-family="sans-serif" font-weight="bold" font-size="12" fill="#ffffff" text-anchor="middle">SONGLE 5V</text>
    <text x="80" y="78" font-family="monospace" font-size="9" fill="#93c5fd" text-anchor="middle">SRD-05VDC-SL-C</text>
    <text x="80" y="94" font-family="monospace" font-size="8" fill="#cbd5e1" text-anchor="middle">10A 250VAC • 10A 30VDC</text>

    <!-- Optocoupler & Diode -->
    <rect x="35" y="125" width="25" height="16" rx="2" fill="#1e293b" stroke="#64748b"/>
    <text x="47" y="136" font-family="monospace" font-size="6" fill="#cbd5e1" text-anchor="middle">OPTO</text>
    <!-- Indicator LEDs -->
    <circle cx="80" cy="133" r="3.5" fill="#ef4444"/> <!-- Power LED -->
    <circle cx="95" cy="133" r="3.5" fill="#10b981"/> <!-- Relay Trigger LED -->

    <!-- Low Voltage Control Pins (To Arduino) -->
    <g transform="translate(30, 180)">
      <rect x="0" y="0" width="100" height="20" rx="3" fill="#1e293b"/>
      <circle cx="15" cy="10" r="3" fill="#ef4444"/>
      <circle cx="50" cy="10" r="3" fill="#64748b"/>
      <circle cx="85" cy="10" r="3" fill="#f59e0b"/>
      <text x="15" y="26" font-family="monospace" font-size="7" fill="#ef4444" text-anchor="middle">VCC</text>
      <text x="50" y="26" font-family="monospace" font-size="7" fill="#64748b" text-anchor="middle">GND</text>
      <text x="85" y="26" font-family="monospace" font-size="7" fill="#f59e0b" text-anchor="middle">IN (D8)</text>
    </g>

    <!-- High Voltage Screw Terminals (To Pump) -->
    <g transform="translate(20, -18)">
      <rect x="0" y="0" width="120" height="24" rx="3" fill="#1e293b" stroke="#475569"/>
      <!-- 3 Screw terminals -->
      <circle cx="20" cy="12" r="6" fill="#475569" stroke="#94a3b8" stroke-width="1.5"/>
      <circle cx="60" cy="12" r="6" fill="#475569" stroke="#94a3b8" stroke-width="1.5"/>
      <circle cx="100" cy="12" r="6" fill="#475569" stroke="#94a3b8" stroke-width="1.5"/>
      <text x="20" y="-4" font-family="monospace" font-size="8" fill="#cbd5e1" text-anchor="middle" font-weight="bold">NO</text>
      <text x="60" y="-4" font-family="monospace" font-size="8" fill="#cbd5e1" text-anchor="middle" font-weight="bold">COM</text>
      <text x="100" y="-4" font-family="monospace" font-size="8" fill="#64748b" text-anchor="middle">NC</text>
    </g>
  </g>

  <!-- ==================== SUBMERSIBLE DC MINI PUMP ==================== -->
  <g transform="translate(800, 520)">
    <rect x="0" y="0" width="150" height="130" rx="10" fill="#1e293b" stroke="#334155" stroke-width="2"/>
    <rect x="150" y="50" width="30" height="30" rx="3" fill="#334155"/>
    <text x="75" y="45" font-family="sans-serif" font-weight="bold" font-size="11" fill="#38bdf8" text-anchor="middle">DC 3V-5V MINI PUMP</text>
    <text x="75" y="65" font-family="monospace" font-size="8" fill="#94a3b8" text-anchor="middle">Brushless Submersible</text>
    <text x="75" y="85" font-family="monospace" font-size="8" fill="#10b981" text-anchor="middle">Flow: 80 - 120 L/hr</text>
    <path d="M 60 100 Q 75 115 90 100" stroke="#0284c7" stroke-width="3" fill="none"/>
    <text x="75" y="118" font-family="sans-serif" font-size="8" fill="#38bdf8" text-anchor="middle">Micro-Drip Output</text>
  </g>

  <!-- ==================== EXTERNAL POWER SUPPLY (5V DC) ==================== -->
  <g transform="translate(560, 600)">
    <rect x="0" y="0" width="160" height="80" rx="8" fill="#0f172a" stroke="#ec4899" stroke-width="1.5"/>
    <text x="80" y="30" font-family="sans-serif" font-weight="bold" font-size="11" fill="#ec4899" text-anchor="middle">EXTERNAL POWER (5V)</text>
    <text x="80" y="48" font-family="monospace" font-size="8" fill="#cbd5e1" text-anchor="middle">Battery / 5V DC 1A Adapter</text>
    <text x="80" y="66" font-family="sans-serif" font-size="7" fill="#94a3b8" text-anchor="middle">(Prevents Arduino brownouts)</text>
    <!-- Terminals -->
    <circle cx="30" cy="80" r="4" fill="#ec4899"/>
    <circle cx="130" cy="80" r="4" fill="#64748b"/>
    <text x="30" y="93" font-family="monospace" font-size="8" fill="#ec4899" font-weight="bold" text-anchor="middle">+5V</text>
    <text x="130" y="93" font-family="monospace" font-size="8" fill="#64748b" font-weight="bold" text-anchor="middle">GND</text>
  </g>

  <!-- ==================== WIRING CONNECTIONS ==================== -->

  <!-- 1. DHT22 DATA to Arduino D2 (Sky Blue) -->
  <path d="M 106 175 L 106 120 L 480 120 L 480 265" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/>
  
  <!-- 2. DHT22 VCC to 5V (Red) -->
  <path d="M 78 175 L 78 95 L 450 95 L 450 495 L 495 495 L 495 505" fill="none" stroke="#ef4444" stroke-width="2"/>

  <!-- 3. DHT22 GND to Arduino GND (Slate) -->
  <path d="M 162 175 L 162 140 L 440 140 L 440 480 L 515 480 L 515 505" fill="none" stroke="#64748b" stroke-width="2"/>

  <!-- 4. Capacitive Moisture AOUT to Arduino A0 (Green) -->
  <path d="M 162 452 L 190 452 L 190 535 L 585 535 L 585 505" fill="none" stroke="#10b981" stroke-width="2.5" stroke-linecap="round"/>

  <!-- 5. Capacitive Moisture VCC to 5V (Red) -->
  <path d="M 88 452 L 88 420 L 495 420 L 495 505" fill="none" stroke="#ef4444" stroke-width="2"/>

  <!-- 6. Capacitive Moisture GND to Arduino GND (Slate) -->
  <path d="M 125 452 L 125 435 L 515 435 L 515 505" fill="none" stroke="#64748b" stroke-width="2"/>

  <!-- 7. Arduino D8 to Relay IN (Orange) -->
  <path d="M 600 265 L 600 200 L 885 200 L 885 340" fill="none" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round"/>

  <!-- 8. Relay VCC to Arduino 5V (Red) -->
  <path d="M 830 365 L 830 380 L 630 380 L 630 520 L 495 520 L 495 505" fill="none" stroke="#ef4444" stroke-width="2"/>

  <!-- 9. Relay GND to Arduino GND (Slate) -->
  <path d="M 850 365 L 850 400 L 650 400 L 650 510 L 515 510 L 515 505" fill="none" stroke="#64748b" stroke-width="2"/>

  <!-- 10. External 5V Power (+) to Relay COM (Pink) -->
  <path d="M 590 680 L 590 710 L 980 710 L 980 142 L 860 142" fill="none" stroke="#ec4899" stroke-width="2.5" stroke-linecap="round"/>

  <!-- 11. Relay NO to Pump (+) (Pink) -->
  <path d="M 820 142 L 780 142 L 780 540 L 800 540" fill="none" stroke="#ec4899" stroke-width="2.5" stroke-linecap="round"/>

  <!-- 12. External Power (-) to Pump (-) Ground Return (Slate) -->
  <path d="M 690 680 L 690 730 L 920 730 L 920 650" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Callout Safeguards Box -->
  <g transform="translate(370, 560)">
    <rect x="0" y="0" width="170" height="90" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
    <text x="85" y="20" font-family="sans-serif" font-weight="bold" font-size="10" fill="#10b981" text-anchor="middle">GALVANIC ISOLATION</text>
    <text x="85" y="38" font-family="sans-serif" font-size="8" fill="#cbd5e1" text-anchor="middle">Pump uses isolated external</text>
    <text x="85" y="52" font-family="sans-serif" font-size="8" fill="#cbd5e1" text-anchor="middle">power. Relay optocoupler</text>
    <text x="85" y="66" font-family="sans-serif" font-size="8" fill="#cbd5e1" text-anchor="middle">protects Arduino from</text>
    <text x="85" y="80" font-family="sans-serif" font-size="8" fill="#38bdf8" text-anchor="middle">inductive motor noise.</text>
  </g>
</svg>
